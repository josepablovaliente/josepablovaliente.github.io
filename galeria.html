            <button class="gallery-filter" type="button" data-filter="congreso">Congresos</button>

              <div class="gallery-caption">

                <strong>Representación académica internacional: Torneo de Robótica TJR</strong>
                <span>USAC · Cooperación y Relaciones Internacionales · 29 Nov 2021</span>

            </button>

              <div class="gallery-caption">

                <strong>Registered Scrum Team Member™</strong>

              </div>

            <button class="gallery-item" type="button" id="congreso" data-cat="congreso"

              <div class="gallery-caption">

  <footer class="site-footer" style="padding-bottom:30px">

    </div>
  </footer>

  <!-- Visor de imágenes -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Visor de documento">
    <button class="lightbox-btn lightbox-close" type="button" aria-label="Cerrar"><i class="fas fa-xmark"></i></button>
    <button class="lightbox-btn lightbox-prev" type="button" aria-label="Anterior"><i class="fas fa-chevron-left"></i></button>
    <button class="lightbox-btn lightbox-next" type="button" aria-label="Siguiente"><i class="fas fa-chevron-right"></i></button>
    <img id="lightboxImg" src="" alt="">
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>

  <script>
    // Tema claro/oscuro (mismo comportamiento que el CV).
    (function () {
      var root = document.documentElement;
      function current() { return root.getAttribute('data-theme') || 'dark'; }
      function paint() {
        document.querySelectorAll('button.nav-dark-toggle i').forEach(function (i) {
          i.className = 'fas ' + (current() === 'dark' ? 'fa-sun' : 'fa-moon');
        });
      }
      document.querySelectorAll('button.nav-dark-toggle').forEach(function (b) {
        b.addEventListener('click', function () {
          var next = current() === 'dark' ? 'light' : 'dark';
          root.setAttribute('data-theme', next);
          try { localStorage.setItem('theme', next); } catch (e) {}
          paint();
        });
      });
      paint();
    })();

    // Filtros por categoría.
    var items = Array.prototype.slice.call(document.querySelectorAll('.gallery-item'));
    document.querySelectorAll('.gallery-filter').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.gallery-filter').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        var f = btn.getAttribute('data-filter');
        items.forEach(function (it) {
          it.classList.toggle('hidden', f !== 'all' && it.getAttribute('data-cat') !== f);
        });
      });
    });

    // Visor: abrir, cerrar, navegar con flechas y teclado.
    var box = document.getElementById('lightbox'), img = document.getElementById('lightboxImg'),
        cap = document.getElementById('lightboxCaption'), idx = 0, lastFocus = null;
    function visible() { return items.filter(function (it) { return !it.classList.contains('hidden'); }); }
    function show(i) {
      var list = visible(); if (!list.length) return;
      idx = (i + list.length) % list.length;
      var it = list[idx];
      img.src = it.getAttribute('data-src');
      img.alt = it.querySelector('img').alt;
      cap.innerHTML = '<strong>' + it.querySelector('strong').textContent + '</strong>' +
                      it.querySelector('.gallery-caption span:last-child').textContent;
    }
    function open(it) {
      lastFocus = document.activeElement;
      show(visible().indexOf(it));
      box.classList.add('open');
      document.body.style.overflow = 'hidden';
      box.querySelector('.lightbox-close').focus();
    }
    function close() {
      box.classList.remove('open');
      document.body.style.overflow = '';
      if (lastFocus) lastFocus.focus();
      if (location.hash) history.replaceState(null, '', location.pathname);
    }
    items.forEach(function (it) { it.addEventListener('click', function () { open(it); }); });
    box.querySelector('.lightbox-close').addEventListener('click', close);
    box.querySelector('.lightbox-prev').addEventListener('click', function () { show(idx - 1); });
    box.querySelector('.lightbox-next').addEventListener('click', function () { show(idx + 1); });
    box.addEventListener('click', function (e) { if (e.target === box) close(); });
    document.addEventListener('keydown', function (e) {
      if (!box.classList.contains('open')) return;
      if (e.key === 'Escape') close();
      if (e.key === 'ArrowLeft') show(idx - 1);
      if (e.key === 'ArrowRight') show(idx + 1);
    });

    // Si se llega desde el CV con #documento, se abre directamente.
    if (location.hash) {
      var target = document.getElementById(location.hash.slice(1));
      if (target && target.classList.contains('gallery-item')) { window.scrollTo(0, 0); open(target); }
    }
    document.getElementById('footer-year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
